<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b100d" />
  <title>Move to Tracky V2</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b100d;color:#f5f4ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(100%,430px);background:#141b16;border:1px solid #263129;border-radius:24px;padding:28px}.brand{font-size:30px;font-weight:850;letter-spacing:-1.4px;margin-bottom:28px}.brand span{color:#93d59b}h1{font-size:25px;letter-spacing:-.7px;margin:0 0 10px}p{color:#8e9a90;line-height:1.55;margin:0 0 22px}.step{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#93d59b;font-weight:750;margin:22px 0 8px}.field{width:100%;border:1px solid #263129;background:#1a231c;color:#f5f4ef;border-radius:12px;padding:13px 14px;font:inherit;outline:none}.field:focus{border-color:#93d59b}.file{display:block;border:1px dashed #3c4c40;border-radius:14px;padding:18px;text-align:center;color:#c8d2c9;cursor:pointer;background:#101712}.file input{display:none}.button{width:100%;border:0;border-radius:12px;padding:14px 16px;font-weight:750;font-size:15px;cursor:pointer;margin-top:18px;background:#93d59b;color:#0b100d}.button:disabled{opacity:.45;cursor:not-allowed}.meta{font-size:12px;color:#8e9a90;margin-top:9px}.error{background:#35191d;color:#f4a8b0;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:14px;display:none}.success{background:#17331c;color:#a9e2b0;padding:12px;border-radius:10px;font-size:13px;margin-top:14px;display:none}.back{display:inline-block;color:#93d59b;text-decoration:none;margin-top:20px;font-size:13px}.pin{letter-spacing:.35em;font-size:19px;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Tracky<span>.</span></div>
    <h1>Move your journal to V2</h1>
    <p>This is a one-time transfer for preview testing. Your original Tracky stays untouched.</p>

    <div class="step">1 · Choose your old Tracky backup</div>
    <label class="file" id="fileLabel">Choose tracky-backup-….json<input id="backup" type="file" accept="application/json,.json" /></label>
    <div class="meta" id="backupMeta"></div>

    <div class="step">2 · Use your 4-digit PIN</div>
    <input id="pin" class="field pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" />
    <div class="meta">Use the same PIN you normally use for Tracky.</div>

    <button id="importButton" class="button" disabled>Import journal</button>
    <div id="error" class="error"></div>
    <div id="success" class="success">Imported. Opening Tracky V2…</div>
    <a class="back" href="/">← Back to Tracky V2</a>
  </main>

<script>
  let parsed = null;
  const backup = document.getElementById('backup');
  const pin = document.getElementById('pin');
  const button = document.getElementById('importButton');
  const meta = document.getElementById('backupMeta');
  const errorBox = document.getElementById('error');
  const successBox = document.getElementById('success');

  function valid() { button.disabled = !(parsed && /^\d{4}$/.test(pin.value)); }
  pin.addEventListener('input', () => { pin.value = pin.value.replace(/\D/g,'').slice(0,4); valid(); });
  backup.addEventListener('change', async () => {
    errorBox.style.display = 'none'; parsed = null; meta.textContent = '';
    const file = backup.files[0]; if (!file) return valid();
    try {
      const value = JSON.parse(await file.text());
      const data = value.data || value;
      if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('This does not look like a Tracky backup.');
      const userId = String(value.userId || '').trim();
      const userName = String(value.userName || '').trim();
      if (!userId || !userName) throw new Error('This backup is missing the Tracky user information. Please export a fresh backup from the old app.');
      parsed = { userId, userName, data };
      meta.textContent = userName + ' · ' + Object.keys(data).length + ' journal days found';
    } catch (e) {
      errorBox.textContent = e.message || 'Could not read this backup.'; errorBox.style.display = 'block';
    }
    valid();
  });

  async function hashPin(value) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  button.addEventListener('click', async () => {
    if (!parsed || !/^\d{4}$/.test(pin.value)) return;
    button.disabled = true; errorBox.style.display = 'none';
    try {
      const usersKey = 'tracky-db-users';
      let users = [];
      try { users = JSON.parse(localStorage.getItem(usersKey) || '[]') || []; } catch {}
      const pin_hash = await hashPin(pin.value);
      const user = {
        id: parsed.userId,
        name: parsed.userName,
        pin_hash,
        lang: 'en',
        skin: 'forest',
        created_at: new Date().toISOString()
      };
      users = [...users.filter(u => String(u.id) !== parsed.userId), user];
      localStorage.setItem(usersKey, JSON.stringify(users));
      localStorage.setItem('tracky-db-data-' + parsed.userId, JSON.stringify(parsed.data));
      successBox.style.display = 'block';
      setTimeout(() => { window.location.href = '/'; }, 700);
    } catch (e) {
      errorBox.textContent = e.message || 'Import failed.'; errorBox.style.display = 'block'; button.disabled = false;
    }
  });
</script>
</body>
</html>
